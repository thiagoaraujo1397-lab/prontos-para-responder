    <text x="0" y="570" fill="#C9DFDD" font-family="Arial, sans-serif" font-size="27" letter-spacing=".5">Um manual prático de</text>
    <text x="0" y="610" fill="#C9DFDD" font-family="Arial, sans-serif" font-size="27" letter-spacing=".5">apologética cristã</text>
  </g>
