    <rect x="0" y="51" width="132" height="5" fill="#C8943E"/>
    <text x="0" y="255" fill="#F6F0E4" font-family="Georgia, serif" font-size="88" font-weight="700">Prontos</text>
    <text x="0" y="359" fill="#F6F0E4" font-family="Georgia, serif" font-size="88" font-weight="700">para</text>
