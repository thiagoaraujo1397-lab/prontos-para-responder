<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1280" role="img" aria-labelledby="title desc">
  <title id="title">Prontos para Responder</title>
  <desc id="desc">Capa provisória azul-marinho e verde-petróleo para o ebook da Sede de Razão.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102A43"/>
      <stop offset="1" stop-color="#0A2035"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="880" height="1280" fill="url(#background)"/>
  <rect x="68" y="72" width="744" height="1136" rx="6" fill="none" stroke="#C8943E" stroke-width="2" opacity=".8"/>
  <path d="M725 0H880V270C817 226 774 163 725 0Z" fill="#277C7A" opacity=".75"/>
